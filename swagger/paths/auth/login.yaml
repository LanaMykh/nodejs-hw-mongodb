tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login user with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: 'oleh1@example.com'
          password:
            description: "User's password"
            type: string
            example: '1234567890'
responses:
  '200':
    description: Login user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: B38QlNHSGZpuBrrLBLWfdq/KlO2eOWMo4aIyHU6G
  '400':
    $ref: '../../components/responses/400.yaml'

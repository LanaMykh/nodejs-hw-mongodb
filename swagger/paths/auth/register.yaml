tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'Register user with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'Yulia Shevc Cat 2'
          email:
            description: "User's email"
            type: string
            example: 'oleh1@example.com'
          password:
            description: "User's password"
            type: string
            example: '$2b$10$U4CfYKk4SQ4Go44RI58zEu8EiDfoY2mJ0eCook/O8Ei8d.rrh663y'
responses:
  '201':
    description: Register user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered user!
            data:
              type: object
              $ref: '../../components/schemas/user.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
